<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello ธรรศธรณ์</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;600;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-top: #070b1e;
      --bg-bottom: #1a1240;
      --ink: #f4f1ff;
      --muted: #a9a3c9;
      --glow-a: #7cf6ff;
      --glow-b: #b98cff;
      --glow-c: #ff8fd1;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: "Kanit", sans-serif;
      color: var(--ink);
      background: radial-gradient(ellipse at 50% 120%, var(--bg-bottom) 0%, var(--bg-top) 65%);
      overflow: hidden;
      display: grid;
      place-items: center;
    }

    /* ---------- ท้องฟ้า ---------- */
    #sky {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* แสงออโรร่าเคลื่อนไหวด้านหลัง */
    .aurora {
      position: fixed;
      width: 70vmax;
      height: 70vmax;
      border-radius: 50%;
      filter: blur(90px);
      opacity: .35;
      animation: drift 18s ease-in-out infinite alternate;
    }
    .aurora.a { background: var(--glow-b); top: -30vmax; left: -20vmax; }
    .aurora.b { background: var(--glow-a); bottom: -35vmax; right: -25vmax; animation-delay: -9s; opacity: .22; }

    @keyframes drift {
      to { transform: translate(12vmax, 8vmax) scale(1.15); }
    }

    /* ---------- ข้อความหลัก ---------- */
    main {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 0 16px;
    }

    .hello {
      font-weight: 300;
      font-size: clamp(1.4rem, 4vw, 2.2rem);
      letter-spacing: .5em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: .4em;
      padding-left: .5em; /* ชดเชย letter-spacing ให้อยู่กลางจริง */
    }

    .hello span {
      display: inline-block;
      opacity: 0;
      transform: translateY(20px);
      animation: rise .6s cubic-bezier(.2,.8,.2,1) forwards;
    }

    .name {
      font-weight: 800;
      font-size: clamp(2.6rem, 11vw, 7rem);
      line-height: 1.15;
      background: linear-gradient(100deg, var(--glow-a), var(--glow-b) 40%, var(--glow-c) 60%, var(--glow-a));
      background-size: 250% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      opacity: 0;
      animation:
        reveal 1.2s 1s cubic-bezier(.2,.8,.2,1) forwards,
        shimmer 6s 2.2s linear infinite;
      filter: drop-shadow(0 0 30px rgba(185, 140, 255, .35));
    }

    .tagline {
      margin-top: 1.4em;
      font-family: "JetBrains Mono", monospace;
      font-size: clamp(.85rem, 2.2vw, 1rem);
      color: var(--muted);
      min-height: 1.5em;
    }

    .cursor {
      display: inline-block;
      width: .55em;
      height: 1.1em;
      vertical-align: -0.2em;
      background: var(--glow-a);
      margin-left: 2px;
      animation: blink 1s steps(1) infinite;
    }

    .hint {
      position: fixed;
      bottom: 24px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: .8rem;
      color: var(--muted);
      opacity: 0;
      animation: fade 1s 4s forwards;
      z-index: 1;
    }

    @keyframes rise   { to { opacity: 1; transform: none; } }
    @keyframes reveal {
      from { opacity: 0; transform: scale(.85); letter-spacing: .15em; filter: blur(12px); }
      to   { opacity: 1; transform: none; letter-spacing: 0; filter: drop-shadow(0 0 30px rgba(185,140,255,.35)); }
    }
    @keyframes shimmer { to { background-position: -250% 0; } }
    @keyframes blink   { 50% { opacity: 0; } }
    @keyframes fade    { to { opacity: .7; } }

    /* เคารพผู้ใช้ที่ตั้งค่าลดการเคลื่อนไหว */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01s !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <canvas id="sky"></canvas>
  <div class="aurora a"></div>
  <div class="aurora b"></div>

  <main>
    <p class="hello" id="hello">Hello</p>
    <h1 class="name">ธรรศธรณ์ เจียมตน</h1>
    <p class="tagline"><span id="typed"></span><span class="cursor"></span></p>
  </main>

  <p class="hint">✦ คลิกที่ไหนก็ได้เพื่อปล่อยดาวตก ✦</p>

  <script>
    // ---------- 1. แยกคำว่า Hello เป็นตัวอักษร ให้ลอยขึ้นทีละตัว ----------
    const hello = document.getElementById("hello");
    hello.innerHTML = [...hello.textContent]
      .map((ch, i) => `<span style="animation-delay:${i * 0.12}s">${ch}</span>`)
      .join("");

    // ---------- 2. ข้อความพิมพ์ทีละตัว วนหลายประโยค ----------
    const lines = [
      "Computer Engineering @ KU Sriracha",
      "git push && it's live 🚀",
      "Hosted with GitHub Pages",
    ];
    const typed = document.getElementById("typed");
    let line = 0, pos = 0, deleting = false;

    function type() {
      const text = lines[line];
      typed.textContent = text.slice(0, pos);

      if (!deleting && pos < text.length)      { pos++; setTimeout(type, 60); }
      else if (!deleting)                      { deleting = true; setTimeout(type, 1800); }
      else if (pos > 0)                        { pos--; setTimeout(type, 30); }
      else { deleting = false; line = (line + 1) % lines.length; setTimeout(type, 300); }
    }
    setTimeout(type, 2400);

    // ---------- 3. ท้องฟ้าดาว + ดาวตก ด้วย canvas ----------
    const canvas = document.getElementById("sky");
    const ctx = canvas.getContext("2d");
    let stars = [], meteors = [], w, h, dpr;

    function resize() {
      dpr = window.devicePixelRatio || 1;
      w = innerWidth; h = innerHeight;
      canvas.width = w * dpr; canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      // จำนวนดาวขึ้นกับขนาดจอ
      stars = Array.from({ length: Math.floor(w * h / 3500) }, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 1.3 + 0.2,
        phase: Math.random() * Math.PI * 2,
        speed: Math.random() * 0.02 + 0.005,
      }));
    }

    function spawnMeteor(x, y) {
      meteors.push({
        x: x ?? Math.random() * w * 0.8 + w * 0.2,
        y: y ?? Math.random() * h * 0.3,
        vx: -(Math.random() * 6 + 8),
        vy: Math.random() * 3 + 4,
        life: 1,
      });
    }

    function draw() {
      ctx.clearRect(0, 0, w, h);

      // ดาวกะพริบ
      for (const s of stars) {
        s.phase += s.speed;
        ctx.globalAlpha = 0.35 + Math.sin(s.phase) * 0.35 + 0.3;
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }

      // ดาวตก (หัวสว่าง หางไล่สีจาง)
      for (const m of meteors) {
        const tailX = m.x - m.vx * 10, tailY = m.y - m.vy * 10;
        const grad = ctx.createLinearGradient(m.x, m.y, tailX, tailY);
        grad.addColorStop(0, `rgba(124,246,255,${m.life})`);
        grad.addColorStop(1, "rgba(185,140,255,0)");
        ctx.globalAlpha = 1;
        ctx.strokeStyle = grad;
        ctx.lineWidth = 2;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(m.x, m.y);
        ctx.lineTo(tailX, tailY);
        ctx.stroke();

        m.x += m.vx; m.y += m.vy; m.life -= 0.012;
      }
      meteors = meteors.filter(m => m.life > 0 && m.x > -200 && m.y < h + 200);

      requestAnimationFrame(draw);
    }

    addEventListener("resize", resize);
    addEventListener("pointerdown", e => spawnMeteor(e.clientX + 120, e.clientY - 90));
    setInterval(() => Math.random() < 0.6 && spawnMeteor(), 2500);

    resize();
    draw();
  </script>
</body>
</html>
